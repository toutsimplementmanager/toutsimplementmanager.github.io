<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#1f2a44">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <a href="#/fiches" class="brand"><img src="icon.svg" alt="" width="28" height="28"><span>Copilote <b>Manager</b></span></a>
    <nav class="nav" id="nav">
      <a href="#/fiches" data-route="fiches">Mes fiches</a>
      <a href="#/historique" data-route="historique">Historique</a>
      <a href="#/resultat" data-route="resultat">Mon profil</a>
      <a href="#/compte" data-route="compte">Compte</a>
    </nav>
    <a href="#/accompagnement" class="btn accent sm go-further">Aller plus loin</a>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="site-footer" id="footer">
    <a href="#/mentions-legales">Mentions légales</a> · <a href="#/confidentialite">Confidentialité</a>
  </footer>

  <nav class="tabbar" id="tabbar" hidden>
    <a href="#/fiches" data-route="fiches"><span>📚</span>Fiches</a>

  <dialog id="modal">
    <form method="dialog" id="modalForm">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button value="cancel" class="btn ghost" formnovalidate>Annuler</button>
        <button value="ok" class="btn primary" id="modalOk">Confirmer</button>
      </div>
    </form>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/content.js"></script>
  <script src="js/legal.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
