<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copilote Manager</title>
  <meta name="description" content="Votre copilote pour piloter votre équipe : 1:1, tâches, objectifs et feedbacks.">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><img src="icon.svg" alt="" width="28" height="28"> Copilote <span>Manager</span></div>
      <nav id="nav">
        <a href="#/dashboard" data-route="dashboard">🧭 Tableau de bord</a>
        <a href="#/team" data-route="team">👥 Équipe</a>
        <a href="#/meetings" data-route="meetings">🗣️ One-to-one</a>
        <a href="#/tasks" data-route="tasks">✅ Tâches</a>
        <a href="#/goals" data-route="goals">🎯 Objectifs</a>
        <a href="#/feedback" data-route="feedback">💬 Feedbacks</a>
        <a href="#/settings" data-route="settings">⚙️ Données</a>
      </nav>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">☰</button>
        <h1 id="pageTitle">Tableau de bord</h1>
        <input type="search" id="globalSearch" placeholder="Rechercher…" aria-label="Rechercher">
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <dialog id="modal">
    <form method="dialog" id="modalForm">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button value="cancel" class="btn ghost" formnovalidate>Annuler</button>
        <button value="ok" class="btn primary" id="modalOk">Enregistrer</button>
      </div>
    </form>
  </dialog>
  <div id="toast" role="status"></div>

  <script src="js/store.js"></script>
  <script src="js/copilot.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
